[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpilot-ai"
version = "1.0.0"
description = "CloudPilot AI - Unified Cloud Reasoning & Autonomous Optimization Engine"
readme = "docker/EXECUTIVE_SUMMARY.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "PyJWT>=2.8.1",
    "cryptography>=41.0.7",
    "alembic>=1.13.0"
]

[tool.pytest.ini_options]
pythonpath = ["docker", "."]
testpaths = ["docker"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore::starlette.exceptions.StarletteDeprecationWarning"
]
asyncio_mode = "auto"
