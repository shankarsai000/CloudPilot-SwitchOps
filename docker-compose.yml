version: '3.8'

services:
  cloudpilot-api:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: cloudpilot-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/demo/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
