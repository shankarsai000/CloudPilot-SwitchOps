name: CloudPilot CI/CD Pipeline

on:
  push:
    branches: [ main, master, "develop/**", "release/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Validate Platform
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudpilot
          POSTGRES_PASSWORD: cloudpilot_test_password
          POSTGRES_DB: cloudpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.txt
          pip install flake8 mypy pytest-cov

      - name: Run Syntax & Lint Checks
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 docker/core docker/main.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Database Migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg2://cloudpilot:cloudpilot_test_password@localhost:5432/cloudpilot_test
        run: |
          alembic upgrade head
          alembic check

      - name: Run Full Test Suite (M1-M11 + Platform Foundation)
        env:
          DATABASE_URL: postgresql+psycopg2://cloudpilot:cloudpilot_test_password@localhost:5432/cloudpilot_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars!
        run: |
          pytest docker/tests/test_platform_foundation.py -v
          pytest docker/test_application_agent.py \
                 docker/test_cost_intelligence.py \
                 docker/test_decision_engine.py \
                 docker/test_demo_environment.py \
                 docker/test_digital_twin.py \
                 docker/test_execution_agent.py \
                 docker/test_explainability.py \
                 docker/test_infrastructure_discovery.py \
                 docker/test_learning_agent.py \
                 docker/test_risk_engine.py \
                 docker/test_strategy_agent.py -v

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
